<div class="main-grouper-container">
    @if(showSeachBar) {
        <div class="grouper-header">
            <mat-form-field appearance="outline" style="width: 100%;">
                <mat-label>Buscar ciudad por nombre</mat-label>
                <input
                [formControl]="searchControl"
                type="text"
                matInput
                [matAutocomplete]="auto">
            </mat-form-field>
            <mat-autocomplete
                #auto="matAutocomplete"
                [displayWith]="displayFn"
                (optionSelected)="citySelected($event)"
            >
                @for(cityInfo of options$ | async; track $index) {
                    <mat-option
                        [value]="cityInfo"
                    >
                        {{ displayFn(cityInfo) }}
                    </mat-option>
                }
            </mat-autocomplete>
            <button mat-fab (click)="resetOriginal()">
                <mat-icon fontIcon="refresh"></mat-icon>
            </button>
        </div>
    }
    @if(weatherFiltered.length == 0) {
        <div class="empty-grouper">
            <p>No se encontraron resultados</p>
        </div>
    }
    @if (weatherFiltered.length > 0) {
        <div class="grouper-container">
            <div class="card-container">
                @for (cardInfo of weatherFiltered; track $index) {
                    <app-card
                        [weatherInfo]="cardInfo"
                    ></app-card>
                }    
            </div>
        </div>
        
    }
</div>
